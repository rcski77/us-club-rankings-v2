services:
  postgres:
    image: postgres:16
    container_name: us-club-rankings-v2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: us_club_rankings_dev
    ports:
      - "5432:5432"
    volumes:
      - us-club-rankings-v2-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  us-club-rankings-v2-db-data:
