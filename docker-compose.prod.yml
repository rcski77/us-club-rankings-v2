# Deploy on a homelab Docker host:
#
#   Public exposure: a Cloudflare Tunnel (cloudflared, run on the host, not part of
#   this compose file) is the *only* path from the public internet to `app`'s
#   published port -- there's no other reverse proxy or direct port-forward. This
#   matters for src/auth.ts's login rate-limiter: Cloudflare's edge sets
#   CF-Connecting-IP to the real visitor IP and overwrites any client-supplied value,
#   so it's safe to trust for that one port -- if this app is ever additionally
#   exposed some other way (direct port-forward, a different reverse proxy), that
#   header stops being trustworthy and the rate-limiter needs revisiting.
#
#   1. Copy this repo to the host (or build+push the image elsewhere).
#   2. Create a `.env.prod` next to this file (see .env.prod.example).
#   3. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#      (--env-file is required in addition to env_file: below -- env_file only
#      injects vars into the container, it doesn't feed the ${POSTGRES_PASSWORD}
#      interpolation used in this file)
#      This now runs `prisma migrate deploy` automatically via the `migrate`
#      service below (built from the `deps` stage, which has the Prisma CLI)
#      before `app` starts -- committed migrations in prisma/migrations/ land
#      on every redeploy with no manual step. Unlike `db push`, this only ever
#      applies migration files that were already generated and committed (via
#      `npx prisma migrate dev` locally) -- nothing is computed or applied
#      unreviewed at deploy time, so it's safe to run unattended.
#   4. First deploy only, seed the empty database (same throwaway-container
#      approach, now that Postgres isn't published to the host) via ./run-prod-script.sh
#      (reads POSTGRES_PASSWORD from .env.prod itself, run from the repo root on the
#      homelab host -- see that script's own header comment for details):
#        ./run-prod-script.sh prisma/seed.ts
#        ./run-prod-script.sh prisma/seedRegions.ts
#      The same script works for any other prisma/*.ts one-off (e.g.
#      prisma/backtestElo.ts, a read-only report -- safe to run against prod anytime,
#      not just first-deploy):
#        ./run-prod-script.sh prisma/backtestElo.ts
#
#      Alternative — copy over your existing local dev data instead of starting
#      fresh (skips migrate/seed above; the restore brings the schema with it):
#        # on your dev machine:
#        docker exec -t us-club-rankings-v2-db pg_dump -U postgres -d us_club_rankings_dev -F c -f /tmp/dump.pgdump
#        docker cp us-club-rankings-v2-db:/tmp/dump.pgdump ./dump.pgdump
#        scp dump.pgdump user@homelab-host:~/
#        # on the homelab host, once this stack is up:
#        docker cp ~/dump.pgdump us-club-rankings-v2-db-prod:/tmp/dump.pgdump
#        docker exec -t us-club-rankings-v2-db-prod pg_restore -U postgres -d us_club_rankings /tmp/dump.pgdump
#        docker exec us-club-rankings-v2-db-prod rm /tmp/dump.pgdump
#        docker compose -f docker-compose.prod.yml restart app
#
#      Need external DB access later (e.g. a GUI client)? Add a `ports:` entry
#      on the `postgres` service below using a non-default host port, e.g.
#      `"15432:5432"`, to avoid colliding with any other Postgres on the host.

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: us-club-rankings-v2-migrate
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/us_club_rankings
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: us-club-rankings-v2-app
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/us_club_rankings
      RANKING_COMPUTE_URL: http://ranking-compute:4100
    ports:
      - "3003:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Runs the Colley/Elo/Massey ratings recompute -- CPU-heavy, spawns several child
  # processes of its own per run (see src/lib/rating/rankingComputeServer.ts) --
  # physically apart from `app` so a recompute can never compete with `app` for
  # CPU/memory while it's serving admin requests. `app` triggers it over HTTP
  # (RANKING_COMPUTE_URL above); no `ports:` here -- reachable only from other
  # services on this compose network, never published to the host or internet.
  # Reuses `app`'s own image (same Dockerfile/build) since it needs the identical
  # src/ tree, tsconfig.json, and full node_modules (tsx included) that image already
  # has -- just a different command instead of `node server.js`.
  ranking-compute:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: us-club-rankings-v2-ranking-compute
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/us_club_rankings
    command: ["node", "--import", "tsx", "src/lib/rating/rankingComputeServer.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        # VM raised from 4 to 6 vCPUs / 8 to 16GB RAM specifically to give this room.
        #
        # memory: started at 2g, too tight for 2 concurrent partition processes' real
        # footprint -- confirmed live on prod: usage sat pinned at ~97-99% of the 2g
        # limit for the whole run instead of cleanly OOM-killing, pushing the host
        # into swap (~900MB) and causing severe thrashing rather than a crash (one
        # transaction that should take under a minute took 49.8 minutes). Raised to
        # 4g, which fixed the swap/thrashing symptom (confirmed: swap dropped to
        # ~128MB on the next run) but not the failure -- see cpus below.
        #
        # cpus: started at 2 (conservative on the then-4-vCPU host). With memory
        # fixed but cpus still capped at 2, the next run still failed slow (one
        # transaction took 23.4 min instead of under a minute, no swap/memory
        # symptom this time) -- consistent with Docker's CFS bandwidth quota
        # throttling two CPU-heavy partition processes crammed into a 2-core budget.
        # Raised to 4 now that the host has 6 cores to spare, leaving 2 for
        # Postgres/app/other containers on this box.
        #
        # memory, again: raising PARTITION_PROCESS_CONCURRENCY (src/lib/concurrency.ts)
        # 2 -> 4 outgrew 4g -- confirmed live: usage pinned at ~100% and host swap
        # climbed to ~2GB for the run's duration (it still succeeded, just slower and
        # closer to the edge than it should run). Host has 15GB total with ~10GB free
        # at the time, so raised to 8g for real headroom instead of chasing the ceiling
        # again on the next concurrency or data-volume increase.
        limits:
          cpus: "4"
          memory: 8g

  postgres:
    image: postgres:16
    container_name: us-club-rankings-v2-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: us_club_rankings
    volumes:
      - us-club-rankings-v2-db-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  us-club-rankings-v2-db-prod-data:
