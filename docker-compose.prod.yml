# Deploy on a homelab Docker host:
#   1. Copy this repo to the host (or build+push the image elsewhere).
#   2. Create a `.env.prod` next to this file (see .env.prod.example).
#   3. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#      (--env-file is required in addition to env_file: below -- env_file only
#      injects vars into the container, it doesn't feed the ${POSTGRES_PASSWORD}
#      interpolation used in this file)
#      This now runs `prisma migrate deploy` automatically via the `migrate`
#      service below (built from the `deps` stage, which has the Prisma CLI)
#      before `app` starts -- committed migrations in prisma/migrations/ land
#      on every redeploy with no manual step. Unlike `db push`, this only ever
#      applies migration files that were already generated and committed (via
#      `npx prisma migrate dev` locally) -- nothing is computed or applied
#      unreviewed at deploy time, so it's safe to run unattended.
#   4. First deploy only, seed the empty database (same throwaway-container
#      approach, now that Postgres isn't published to the host):
#        docker run --rm --network us-club-rankings-v2_default \
#          -v "$PWD":/app -w /app -e DATABASE_URL=postgres://postgres:<POSTGRES_PASSWORD>@postgres:5432/us_club_rankings \
#          node:24-alpine sh -c "npm ci && npx tsx prisma/seed.ts && npx tsx prisma/seedRegions.ts"
#
#      Alternative — copy over your existing local dev data instead of starting
#      fresh (skips migrate/seed above; the restore brings the schema with it):
#        # on your dev machine:
#        docker exec -t us-club-rankings-v2-db pg_dump -U postgres -d us_club_rankings_dev -F c -f /tmp/dump.pgdump
#        docker cp us-club-rankings-v2-db:/tmp/dump.pgdump ./dump.pgdump
#        scp dump.pgdump user@homelab-host:~/
#        # on the homelab host, once this stack is up:
#        docker cp ~/dump.pgdump us-club-rankings-v2-db-prod:/tmp/dump.pgdump
#        docker exec -t us-club-rankings-v2-db-prod pg_restore -U postgres -d us_club_rankings /tmp/dump.pgdump
#        docker exec us-club-rankings-v2-db-prod rm /tmp/dump.pgdump
#        docker compose -f docker-compose.prod.yml restart app
#
#      Need external DB access later (e.g. a GUI client)? Add a `ports:` entry
#      on the `postgres` service below using a non-default host port, e.g.
#      `"15432:5432"`, to avoid colliding with any other Postgres on the host.

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: us-club-rankings-v2-migrate
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/us_club_rankings
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: us-club-rankings-v2-app
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/us_club_rankings
    ports:
      - "3003:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16
    container_name: us-club-rankings-v2-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: us_club_rankings
    volumes:
      - us-club-rankings-v2-db-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  us-club-rankings-v2-db-prod-data:
